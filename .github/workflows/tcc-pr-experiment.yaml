name: TCC Paired Staging and PDT

on:
  workflow_run:
    workflows:
      - TCC Conventional CI
    types:
      - completed

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize same-repository experimental PR
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.pr.outputs.authorized }}
      runtime_publication_authorized: ${{ steps.pr.outputs.runtime_publication_authorized }}
      pull_request_number: ${{ steps.pr.outputs.pull_request_number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Check PR origin, revision and explicit cloud labels
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          echo "authorized=false" >> "${GITHUB_OUTPUT}"
          echo "runtime_publication_authorized=false" >> "${GITHUB_OUTPUT}"
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || exit 0
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/pull-request.json"
          same_repository=$(jq -r --arg repository "${GITHUB_REPOSITORY}" '.head.repo.full_name == $repository' "${RUNNER_TEMP}/pull-request.json")
          current_revision=$(jq -r --arg sha "${EXPECTED_HEAD_SHA}" '.head.sha == $sha' "${RUNNER_TEMP}/pull-request.json")
          draft=$(jq -r '.draft' "${RUNNER_TEMP}/pull-request.json")
          experiment_label=$(jq -r 'any(.labels[]; .name == "tcc-experiment-cloud")' "${RUNNER_TEMP}/pull-request.json")
          runtime_publication_label=$(jq -r 'any(.labels[]; .name == "tcc-runtime-publication")' "${RUNNER_TEMP}/pull-request.json")
          cost_label=$(jq -r 'any(.labels[]; .name == "tcc-cost-reviewed")' "${RUNNER_TEMP}/pull-request.json")
          if [[ "${same_repository}" != "true" || "${current_revision}" != "true" || "${draft}" == "true" || "${cost_label}" != "true" ]]; then
            exit 0
          fi
          if [[ "${experiment_label}" == "${runtime_publication_label}" ]]; then
            exit 0
          fi
          {
            echo "pull_request_number=${PR_NUMBER}"
            echo "base_sha=$(jq -er '.base.sha' "${RUNNER_TEMP}/pull-request.json")"
            echo "head_sha=$(jq -er '.head.sha' "${RUNNER_TEMP}/pull-request.json")"
            echo "authorized=${experiment_label}"
            echo "runtime_publication_authorized=${runtime_publication_label}"
          } >> "${GITHUB_OUTPUT}"

  runtime-publication:
    name: Publish immutable experiment runtimes only
    needs:
      - authorize
    if: needs.authorize.outputs.runtime_publication_authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: tcc-experiment
    concurrency:
      group: tcc-runtime-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the publication financial kill switch
        shell: bash
        env:
          RUNTIME_PUBLICATION_ACKNOWLEDGED: ${{ vars.TCC_RUNTIME_PUBLICATION_ACKNOWLEDGED }}
        run: |
          set -euo pipefail
          [[ "${RUNTIME_PUBLICATION_ACKNOWLEDGED}" == "true" ]]

      - name: Check out the already validated PR revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the locked pre-freeze protocol state
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .status == "pre-registration-candidate"
            and .frozen_at == null
            and .confirmatory_collection_allowed == false
            and .execution_limits.cloud_execution_authorization
              == "explicit-user-authorization-required-after-freeze"
          ' experiment/protocol/protocol-v1.json >/dev/null

      - name: Authenticate the Artifact Registry-only identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_RUNTIME_PUBLISHER_SERVICE_ACCOUNT }}

      - name: Install Google Cloud SDK without GKE credentials
        uses: google-github-actions/setup-gcloud@v2

      - name: Bind Docker only to the reviewed Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Publish, attest and bind the exact runtime images
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.authorize.outputs.head_sha }}
          PULL_REQUEST_NUMBER: ${{ needs.authorize.outputs.pull_request_number }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          ARTIFACT_REGISTRY_PREFIX: us-central1-docker.pkg.dev/microservices-demo-tcc/online-boutique-experiment
          OUTPUT_DIR: ${{ runner.temp }}/runtime-publication-only
          ALLOW_RUNTIME_PUBLICATION: "true"
          COST_REVIEW_ACKNOWLEDGED: ${{ vars.TCC_RUNTIME_PUBLICATION_ACKNOWLEDGED }}
        run: |
          set -euo pipefail
          export SOURCE_TREE
          SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')
          ./experiment/scripts/publish-experiment-runtimes.sh
          python3 experiment/scripts/bind-runtime-publication.py \
            --repo-root . \
            --publication-summary "${OUTPUT_DIR}/summary.json" \
            --expected-commit "${SOURCE_COMMIT}" \
            --expected-tree "${SOURCE_TREE}" \
            --output-directory "${OUTPUT_DIR}/manifest-bindings"

      - name: Upload publication-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-publication-only-pr-${{ needs.authorize.outputs.pull_request_number }}-${{ needs.authorize.outputs.head_sha }}
          path: ${{ runner.temp }}/runtime-publication-only
          if-no-files-found: warn
          retention-days: 30

  paired-experiment:
    name: Conventional staging plus PDT
    needs:
      - authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: tcc-experiment
    concurrency:
      group: tcc-experiment-cloud
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      human_gate_required: ${{ steps.paired.outputs.human_gate_required }}
    steps:
      - name: Require the per-block financial kill switch
        shell: bash
        env:
          COST_REVIEW_ACKNOWLEDGED: ${{ vars.TCC_COST_REVIEW_ACKNOWLEDGED }}
        run: |
          set -euo pipefail
          [[ "${COST_REVIEW_ACKNOWLEDGED}" == "true" ]]

      - name: Check out the already validated PR revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.37.0

      - name: Install versioned CI prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes jq protobuf-compiler python3-venv shellcheck
          python3 -m venv "${RUNNER_TEMP}/tcc-ci-venv"
          "${RUNNER_TEMP}/tcc-ci-venv/bin/python" -m pip install --disable-pip-version-check \
            PyYAML==6.0.1 \
            protobuf==4.21.12
          echo "${RUNNER_TEMP}/tcc-ci-venv/bin" >> "${GITHUB_PATH}"

      - name: Resolve and require one public experimental candidate
        id: candidate
        shell: bash
        env:
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          PR_NUMBER: ${{ needs.authorize.outputs.pull_request_number }}
        run: |
          set -euo pipefail
          result=$(python3 experiment/scripts/resolve-pr-candidate.py \
            --repo-root . \
            --base-ref "${BASE_SHA}" \
            --head-ref "${HEAD_SHA}" \
            --pull-request-number "${PR_NUMBER}")
          jq -e '.experimental_cloud_eligible == true and (.candidate_definition | type == "string")' <<< "${result}" >/dev/null
          echo "candidate_id=$(jq -er '.candidate_id' <<< "${result}")" >> "${GITHUB_OUTPUT}"
          echo "candidate_definition=$(jq -er '.candidate_definition' <<< "${result}")" >> "${GITHUB_OUTPUT}"
          protocol_status=$(jq -er '.status' experiment/protocol/protocol-v1.json)
          mode=engineering
          if [[ "${protocol_status}" == "frozen" ]]; then
            mode=confirmatory
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate with Google Cloud through Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_EXPERIMENT_SERVICE_ACCOUNT }}

      - name: Install Google Cloud SDK and GKE auth plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Bind Docker and kubectl to the experiment project
        id: cluster
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          gcloud container clusters get-credentials online-boutique-experiment \
            --region us-central1 \
            --project microservices-demo-tcc
          echo "connected=true" >> "${GITHUB_OUTPUT}"

      - name: Publish and attest the exact engineering runtime images
        id: publish_runtimes
        if: steps.candidate.outputs.mode == 'engineering'
        timeout-minutes: 45
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.authorize.outputs.head_sha }}
          PULL_REQUEST_NUMBER: ${{ needs.authorize.outputs.pull_request_number }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          ARTIFACT_REGISTRY_PREFIX: us-central1-docker.pkg.dev/microservices-demo-tcc/online-boutique-experiment
          OUTPUT_DIR: ${{ runner.temp }}/published-experiment-runtimes
          ALLOW_RUNTIME_PUBLICATION: "true"
          COST_REVIEW_ACKNOWLEDGED: ${{ vars.TCC_COST_REVIEW_ACKNOWLEDGED }}
        run: |
          set -euo pipefail
          export SOURCE_TREE
          SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')
          ./experiment/scripts/publish-experiment-runtimes.sh
          python3 experiment/scripts/bind-runtime-publication.py \
            --repo-root . \
            --publication-summary "${OUTPUT_DIR}/summary.json" \
            --expected-commit "${SOURCE_COMMIT}" \
            --expected-tree "${SOURCE_TREE}" \
            --output-directory "${OUTPUT_DIR}/manifest-bindings"
          controller_image=$(jq -er '.images[] | select(.name == "checkout-pdt-controller") | .immutable_reference' "${OUTPUT_DIR}/summary.json")
          echo "controller_image=${controller_image}" >> "${GITHUB_OUTPUT}"

      - name: Validate frozen runtime bindings without rebuilding
        id: frozen_runtimes
        if: steps.candidate.outputs.mode == 'confirmatory'
        shell: bash
        run: |
          set -euo pipefail
          python3 experiment/scripts/validate-pdt-runtime.py \
            --repo-root . --manifest experiment/pdt/runtime-manifest.json --require-frozen
          python3 experiment/scripts/validate-oracle-suite.py \
            --repo-root . --manifest experiment/oracle/suite-manifest.json --require-frozen
          controller_image=$(jq -er '.controller_image' experiment/pdt/runtime-manifest.json)
          for image in \
            "${controller_image}" \
            "$(jq -er '.images.oracle_harness' experiment/oracle/suite-manifest.json)" \
            "$(jq -er '.images.currency_reference' experiment/oracle/suite-manifest.json)"; do
            gcloud artifacts docker images describe "${image}" --format=json >/dev/null
          done
          echo "controller_image=${controller_image}" >> "${GITHUB_OUTPUT}"

      - name: Resolve the controller digest for this execution
        id: runtime
        shell: bash
        env:
          MODE: ${{ steps.candidate.outputs.mode }}
          ENGINEERING_IMAGE: ${{ steps.publish_runtimes.outputs.controller_image }}
          CONFIRMATORY_IMAGE: ${{ steps.frozen_runtimes.outputs.controller_image }}
        run: |
          set -euo pipefail
          if [[ "${MODE}" == "engineering" ]]; then
            controller_image="${ENGINEERING_IMAGE}"
          else
            controller_image="${CONFIRMATORY_IMAGE}"
          fi
          [[ "${controller_image}" =~ @sha256:[a-f0-9]{64}$ ]]
          echo "controller_image=${controller_image}" >> "${GITHUB_OUTPUT}"

      - name: Upload runtime publication evidence
        if: always() && steps.candidate.outputs.mode == 'engineering'
        uses: actions/upload-artifact@v7
        with:
          name: published-experiment-runtimes-pr-${{ needs.authorize.outputs.pull_request_number }}-${{ needs.authorize.outputs.head_sha }}
          path: ${{ runner.temp }}/published-experiment-runtimes
          if-no-files-found: warn
          retention-days: 30

      - name: Run the paired conventional and PDT pipeline
        id: paired
        timeout-minutes: 105
        shell: bash
        env:
          MODE: ${{ steps.candidate.outputs.mode }}
          CANDIDATE_ID: ${{ steps.candidate.outputs.candidate_id }}
          CANDIDATE_DEFINITION: ${{ steps.candidate.outputs.candidate_definition }}
          CANDIDATE_BASE_REF: ${{ needs.authorize.outputs.base_sha }}
          CANDIDATE_HEAD_REF: ${{ needs.authorize.outputs.head_sha }}
          ARTIFACT_REGISTRY_PREFIX: us-central1-docker.pkg.dev/microservices-demo-tcc/online-boutique-experiment
          PDT_CONTROLLER_IMAGE: ${{ steps.runtime.outputs.controller_image }}
          REPETITION: "1"
          ALLOW_EXPERIMENTAL_CLOUD_EXECUTION: "true"
          COST_REVIEW_ACKNOWLEDGED: ${{ vars.TCC_COST_REVIEW_ACKNOWLEDGED }}
        run: |
          set -euo pipefail
          ./experiment/scripts/run-comparative-candidate.sh 2>&1 | tee "${RUNNER_TEMP}/paired-experiment.log"
          pipeline_dir=$(tail -n 1 "${RUNNER_TEMP}/paired-experiment.log")
          [[ -d "${pipeline_dir}" && -f "${pipeline_dir}/summary.json" ]]
          echo "pipeline_dir=${pipeline_dir}" >> "${GITHUB_OUTPUT}"
          human_gate_required=$(jq -r '
            .human_confirmation_required == true
            and .deployment_action_prepared == true
            and .operational_mutation_performed == false
          ' "${pipeline_dir}/summary.json")
          echo "human_gate_required=${human_gate_required}" >> "${GITHUB_OUTPUT}"

      - name: Enforce cleanup of billable experimental workloads
        if: always() && steps.cluster.outputs.connected == 'true'
        timeout-minutes: 15
        shell: bash
        env:
          ALLOW_EXPERIMENTAL_CLEANUP: "true"
          OUTPUT_FILE: ${{ runner.temp }}/experimental-cleanup.json
        run: |
          set -euo pipefail
          ./experiment/scripts/cleanup-experimental-workloads.sh

      - name: Upload paired experimental evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-experiment-pr-${{ needs.authorize.outputs.pull_request_number }}-${{ needs.authorize.outputs.head_sha }}
          path: |
            experiment/evidence/ci-cd/ci-${{ steps.candidate.outputs.candidate_id }}-*/
            experiment/evidence/staging/staging-${{ steps.candidate.outputs.candidate_id }}-*/
            experiment/evidence/pdt-state/operational-state-*/
            experiment/evidence/pdt-cycles/pdt-${{ steps.candidate.outputs.candidate_id }}-*/
            experiment/evidence/pipeline/paired-${{ steps.candidate.outputs.candidate_id }}-*/
            ${{ runner.temp }}/experimental-cleanup.json
          if-no-files-found: warn
          retention-days: 14

  human-gate-receipt:
    name: Record protected human PDT decision
    needs:
      - authorize
      - paired-experiment
    if: needs.paired-experiment.outputs.human_gate_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: tcc-deployment-approval
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact reviewed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false

      - name: Download the sealed paired evidence
        uses: actions/download-artifact@v8
        with:
          name: paired-experiment-pr-${{ needs.authorize.outputs.pull_request_number }}-${{ needs.authorize.outputs.head_sha }}
          path: ${{ runner.temp }}/paired-evidence

      - name: Record the protected environment reviewer and decision
        id: receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_ENVIRONMENT: tcc-deployment-approval
        run: |
          set -euo pipefail
          mapfile -t gate_files < <(find "${RUNNER_TEMP}/paired-evidence" -type f -path '*/paired-*/gate.json' -print)
          [[ ${#gate_files[@]} -eq 1 ]]
          pipeline_dir=$(dirname "${gate_files[0]}")
          [[ -f "${pipeline_dir}/deployment-action.json" ]]
          [[ $(jq -er '.gate_state' "${pipeline_dir}/gate.json") == "awaiting-human-confirmation" ]]
          [[ $(jq -er '.status' "${pipeline_dir}/deployment-action.json") == "prepared-awaiting-human-confirmation" ]]

          approval_history="${RUNNER_TEMP}/github-environment-approvals.json"
          gh api \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" \
            > "${approval_history}"

          receipt="${pipeline_dir}/human-gate-decision.json"
          python3 experiment/scripts/record-human-gate-decision.py \
            --deployment-gate "${pipeline_dir}/gate.json" \
            --deployment-action "${pipeline_dir}/deployment-action.json" \
            --decision approve-isolated-validation \
            --github-approval-history "${approval_history}" \
            --github-environment "${REVIEW_ENVIRONMENT}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --github-workflow-run-id "${GITHUB_RUN_ID}" \
            --output "${receipt}"
          cp "${approval_history}" "${pipeline_dir}/github-environment-approvals.json"
          jq -e '
            .status == "approved"
            and .scope == "isolated-oracle-validation"
            and .human_review_evidence.environment == "tcc-deployment-approval"
            and .cloud_execution_authorized == false
            and .operational_mutation_authorized == false
          ' "${receipt}" >/dev/null
          echo "pipeline_dir=${pipeline_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload the immutable human gate receipt
        uses: actions/upload-artifact@v7
        with:
          name: human-gate-receipt-pr-${{ needs.authorize.outputs.pull_request_number }}-${{ needs.authorize.outputs.head_sha }}
          path: ${{ steps.receipt.outputs.pipeline_dir }}/
          if-no-files-found: error
          retention-days: 30
