apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../staging
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: checkoutservice
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 100m
